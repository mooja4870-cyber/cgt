name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: gradle assembleRelease --no-daemon

    - name: Upload APK to release directory
      run: |
        mkdir -p release
        cp app/build/outputs/apk/release/app-release.apk release/CGT.apk

    - name: Commit and push APK
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add release/CGT.apk
        git commit -m "chore: 자동 빌드 APK 업데이트" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
