plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def gitTagVersion = "v0.0.0"
def gitTagVersionCode = 1
try {
    def resolvedTag = "git describe --tags --abbrev=0".execute([], rootProject.rootDir).text.trim()
    if (resolvedTag && resolvedTag.startsWith("v")) {
        gitTagVersion = resolvedTag
        def m = (resolvedTag =~ /^v(\d+)\.(\d+)\.(\d+)$/)
        if (m.matches()) {
            def major = m[0][1] as int
            def minor = m[0][2] as int
            def patch = m[0][3] as int
            gitTagVersionCode = (major * 10000) + (minor * 100) + patch
            println "✅ Git Tag 인식: $gitTagVersion → versionCode=$gitTagVersionCode"
        } else {
            println "⚠️ 태그 형식 미일치: $resolvedTag (예: v4.0.18)"
        }
    } else {
        println "⚠️ Git 태그 없음, 기본값 사용"
    }
} catch (Exception e) {
    println "⚠️ Git 태그 읽기 실패: ${e.message}, 기본값 사용"
}

android {
    namespace "com.yangdotax.calculator"
    compileSdk 36

    defaultConfig {
        applicationId "com.yangdotax.calculator"
        minSdk 23
        targetSdk 36
        versionCode gitTagVersionCode
        versionName gitTagVersion
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
