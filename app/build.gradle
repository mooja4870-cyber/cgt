plugins {
    id "com.android.application"
}

def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def gitTagVersion = "v0.0.0"
try {
    def tagOutput = new ByteArrayOutputStream()
    exec {
        commandLine "git", "describe", "--tags", "--abbrev=0"
        standardOutput = tagOutput
        ignoreExitValue = true
    }
    def resolvedTag = tagOutput.toString().trim()
    if (resolvedTag) gitTagVersion = resolvedTag
} catch (Exception ignored) {
}

android {
    namespace "com.yangdotax.calculator"
    compileSdk 35

    defaultConfig {
        applicationId "com.yangdotax.calculator"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName gitTagVersion
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
