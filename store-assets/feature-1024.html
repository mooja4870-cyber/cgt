<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; }
body { width:1024px; height:500px; overflow:hidden; font-family:-apple-system,'Apple SD Gothic Neo','Helvetica Neue',sans-serif; }
.bg { position:relative; width:1024px; height:500px; background:linear-gradient(135deg,#0E7A57 0%,#18A176 60%,#25B98A 100%); }
.icon { position:absolute; left:90px; top:110px; width:280px; height:280px; background:#0C6B4C; border-radius:60px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
.icon .won { position:absolute; width:100%; text-align:center; top:30px; font-size:150px; font-weight:900; color:#fff; }
.icon .arrow { position:absolute; bottom:55px; left:70px; width:140px; height:10px; background:#E8557E; border-radius:5px; }
.txt { position:absolute; left:450px; top:130px; color:#fff; }
.txt h1 { font-size:88px; font-weight:900; letter-spacing:-2px; }
.txt p { margin-top:24px; font-size:38px; font-weight:500; opacity:.92; }
.badge { position:absolute; left:450px; top:350px; display:inline-block; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.5); color:#fff; font-size:26px; font-weight:700; padding:12px 28px; border-radius:40px; }
</style></head>
<body><div class="bg">
<div class="icon"><div class="won">₩</div><div class="arrow"></div></div>
<div class="txt"><h1>양도세 계산</h1><p>부동산 양도소득세 간편 계산기</p></div>
<div class="badge">2026년 세법 기준 · 간편 계산</div>
</div></body></html>
